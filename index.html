<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradeTrack Pro</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <link rel="icon" type="image/png" href="https://i.imgur.com/vH9jZ9B.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/vH9jZ9B.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #1e40af; --success: #10b981; --danger: #ef4444;
            --bg-primary: #ffffff; --bg-secondary: #f9fafb;
            --text-primary: #111827; --text-secondary: #6b7280; --border-color: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #60a5fa; --bg-primary: #111827; --bg-secondary: #1f2937;
                --text-primary: #f3f4f6; --text-secondary: #9ca3af; --border-color: #374151;
            }
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-secondary); color: var(--text-primary); }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }
        
        header {
            background: var(--bg-primary); padding: 12px 16px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000;
        }
        .logo-group { display: flex; align-items: center; gap: 10px; }
        
        /* LOGO FIX: Ensuring it has dimensions and visibility */
        .app-logo { 
            width: 32px; height: 32px; border-radius: 6px; object-fit: cover; 
            display: block; background: #eee; 
        }

        .tabs { display: flex; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 12px; margin: 15px 0; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: none; color: var(--text-secondary); cursor: pointer; font-weight: 600; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
        
        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); font-size: 16px; }
        
        .main-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .upload-btn { background: var(--bg-secondary); border: 2px dashed var(--border-color); color: var(--text-primary); padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; display: block; width: 100%; margin-bottom: 10px; }

        .img-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .img-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }
        .chart-container { height: 220px; width: 100%; }
        
        .entry-card { background: var(--bg-primary); border: 1px solid var(--border-color); padding: 14px; border-radius: 14px; margin-bottom: 12px; border-left: 6px solid var(--primary); }
    </style>
</head>
<body>

<header>
    <div class="logo-group">
        <img src="https://i.imgur.com/vH9jZ9B.png" 
             alt="T" 
             class="app-logo" 
             id="mainLogo"
             onerror="this.src='https://via.placeholder.com/32/1e40af/ffffff?text=T'">
        <h1 style="font-size: 18px; font-weight: 800;">TradeTrack</h1>
    </div>
    <div id="currentAcc" style="font-size: 12px; font-weight: 700; color: var(--primary);">Loading...</div>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('dash', this)">Stats</button>
        <button class="tab-btn" onclick="showTab('add', this)">+ Log</button>
        <button class="tab-btn" onclick="showTab('set', this)">Data</button>
    </div>

    <div id="dash" class="tab-content active">
        <div class="card"><div class="chart-container"><canvas id="mainChart"></canvas></div></div>
        <div id="history"></div>
    </div>

    <div id="add" class="tab-content">
        <div class="card">
            <form id="tradeForm">
                <div class="form-group">
                    <label>Account</label>
                    <select id="accSelect"></select>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex:1;"><label>Start</label><input type="number" id="sBal" step="0.01" required></div>
                    <div class="form-group" style="flex:1;"><label>End</label><input type="number" id="eBal" step="0.01" required></div>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Trade Screenshots</label>
                    <div class="upload-btn" onclick="document.getElementById('fileIn').click()">📸 Click to Upload Charts</div>
                    <input type="file" id="fileIn" hidden multiple accept="image/*" onchange="processImages(event)">
                    <div id="previews" class="img-grid"></div>
                </div>
                <button type="submit" class="main-btn">Save Session</button>
            </form>
        </div>
    </div>

    <div id="set" class="tab-content">
        <div class="card">
            <h3>Backup Data</h3>
            <button class="main-btn" onclick="exportData()" style="background:#eee; color:#333;">📥 Download JSON</button>
        </div>
    </div>
</div>

<script>
    let db = { accounts: ['MEXC Futures'], entries: [], active: 'MEXC Futures' };
    let tempImgs = [];
    let myChart = null;

    function save() {
        localStorage.setItem('trade_track_final', JSON.stringify(db));
        render();
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if(id === 'dash') setTimeout(renderChart, 50);
    }

    // FIXED IMAGE PROCESSING
    async function processImages(e) {
        const files = Array.from(e.target.files);
        const previewDiv = document.getElementById('previews');
        
        for (let f of files) {
            const reader = new FileReader();
            reader.readAsDataURL(f);
            reader.onload = (ev) => {
                const img = new Image();
                img.src = ev.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const max = 800;
                    const scale = max / img.width;
                    canvas.width = max;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const compressed = canvas.toDataURL('image/jpeg', 0.6);
                    tempImgs.push(compressed);
                    
                    // Update UI immediately
                    const newImg = document.createElement('img');
                    newImg.src = compressed;
                    previewDiv.appendChild(newImg);
                };
            };
        }
    }

    document.getElementById('tradeForm').onsubmit = (e) => {
        e.preventDefault();
        const entry = {
            id: Date.now(),
            acc: document.getElementById('accSelect').value,
            date: new Date().toLocaleDateString(),
            pnl: parseFloat(document.getElementById('eBal').value) - parseFloat(document.getElementById('sBal').value),
            notes: document.getElementById('notes').value,
            imgs: [...tempImgs]
        };
        db.entries.unshift(entry);
        tempImgs = [];
        document.getElementById('tradeForm').reset();
        document.getElementById('previews').innerHTML = '';
        save();
        showTab('dash', document.querySelector('.tab-btn'));
    };

    function render() {
        document.getElementById('currentAcc').innerText = db.active;
        document.getElementById('accSelect').innerHTML = db.accounts.map(a => `<option>${a}</option>`).join('');
        
        const filtered = db.entries;
        document.getElementById('history').innerHTML = filtered.map(e => `
            <div class="entry-card">
                <div style="display:flex; justify-content:space-between;">
                    <strong>${e.date}</strong>
                    <span style="color:${e.pnl>=0?'var(--success)':'var(--danger)'}">$${e.pnl.toFixed(2)}</span>
                </div>
                <p style="font-size:13px; margin:5px 0;">${e.notes}</p>
                <div class="img-grid">${e.imgs.map(i => `<img src="${i}">`).join('')}</div>
            </div>
        `).join('');
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        const filtered = [...db.entries].reverse();
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: filtered.map(e => e.date),
                datasets: [{ data: filtered.map(e => e.pnl), borderColor: '#60a5fa', fill: true, tension: 0.4 }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'trades.json';
        a.click();
    }

    window.onload = () => {
        const saved = localStorage.getItem('trade_track_final');
        if(saved) db = JSON.parse(saved);
        render();
    };
</script>
</body>
</html>
