<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradeTrack Pro</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TradeTrack">
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="icon" type="image/png" href="https://i.imgur.com/vH9jZ9B.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/vH9jZ9B.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --primary: #1e40af;
            --success: #10b981;
            --danger: #ef4444;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #60a5fa;
                --bg-primary: #111827;
                --bg-secondary: #1f2937;
                --text-primary: #f3f4f6;
                --text-secondary: #9ca3af;
                --border-color: #374151;
            }
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }

        header {
            background: var(--bg-primary);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-group { display: flex; align-items: center; gap: 10px; }
        .app-logo { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }

        .tabs {
            display: flex;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin: 15px 0;
            overflow: hidden;
        }

        .tab-btn {
            flex: 1; padding: 12px; border: none; background: none;
            color: var(--text-secondary); cursor: pointer; font-weight: 600; font-size: 14px;
        }

        .tab-btn.active { background: var(--primary); color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .stat-box { background: var(--bg-primary); padding: 16px; border-radius: 16px; text-align: center; border: 1px solid var(--border-color); }
        .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 4px; }
        .stat-val { font-size: 22px; font-weight: 800; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
        
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--bg-secondary);
            color: var(--text-primary); font-size: 16px;
        }

        button.main-btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: var(--primary); color: white; font-weight: 700; cursor: pointer;
            transition: opacity 0.2s;
        }

        .entry-card {
            background: var(--bg-primary); border: 1px solid var(--border-color);
            padding: 14px; border-radius: 14px; margin-bottom: 12px;
            border-left: 6px solid var(--primary);
        }

        .img-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .img-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }

        .chart-container { height: 220px; width: 100%; }
        
        #msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; }
        .alert { background: #10b981; color: white; padding: 10px 20px; border-radius: 30px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<header>
    <div class="logo-group">
        <img src="https://i.imgur.com/vH9jZ9B.png" alt="Logo" class="app-logo" onerror="this.src='https://via.placeholder.com/32?text=T'">
        <h1 style="font-size: 18px; font-weight: 800;">TradeTrack</h1>
    </div>
    <div id="currentAcc" style="font-size: 12px; font-weight: 700; color: var(--primary);">Loading...</div>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('dash')">Stats</button>
        <button class="tab-btn" onclick="showTab('add')">+ Log</button>
        <button class="tab-btn" onclick="showTab('set')">Data</button>
    </div>

    <div id="msg"></div>

    <div id="dash" class="tab-content active">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Total P&L</div>
                <div id="totalPnl" class="stat-val">$0.00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Win Rate</div>
                <div id="winRate" class="stat-val">0%</div>
            </div>
        </div>
        <div class="card">
            <div class="chart-container"><canvas id="mainChart"></canvas></div>
        </div>
        <div id="history"></div>
    </div>

    <div id="add" class="tab-content">
        <div class="card">
            <form id="tradeForm">
                <div class="form-group">
                    <label>Account</label>
                    <select id="accSelect"></select>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex:1;">
                        <label>Start Balance</label>
                        <input type="number" id="sBal" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>End Balance</label>
                        <input type="number" id="eBal" step="0.01" required placeholder="0.00">
                    </div>
                </div>
                <div class="form-group">
                    <label>Session Notes</label>
                    <textarea id="notes" rows="3" placeholder="Strategy used, emotions, mistakes..."></textarea>
                </div>
                <div class="form-group">
                    <button type="button" style="background: var(--bg-secondary); border: 1px dashed var(--border-color); color: var(--text-primary); margin-bottom: 10px;" onclick="document.getElementById('fileIn').click()">🖼️ Upload Charts</button>
                    <input type="file" id="fileIn" hidden multiple accept="image/*" onchange="processImages(event)">
                    <div id="previews" class="img-grid"></div>
                </div>
                <button type="submit" class="main-btn">Save Trading Day</button>
            </form>
        </div>
    </div>

    <div id="set" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:12px">Manage Accounts</h3>
            <div id="accList"></div>
            <div style="display: flex; gap: 8px; margin-top:12px;">
                <input type="text" id="newAccName" placeholder="Account Name">
                <button onclick="createAcc()" style="width: auto; padding: 0 15px; background: var(--success); color: white; border: none; border-radius: 10px;">Add</button>
            </div>
        </div>
        <div class="card">
            <h3 style="margin-bottom:12px">Backup & Privacy</h3>
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 15px;">Your data is stored locally in your browser. Export frequently to keep a backup.</p>
            <button class="main-btn" onclick="exportData()" style="margin-bottom:10px; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color);">📥 Download JSON</button>
            <button class="main-btn" onclick="document.getElementById('importIn').click()" style="background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color);">📤 Restore Backup</button>
            <input type="file" id="importIn" hidden onchange="importData(event)">
        </div>
    </div>
</div>

<script>
    let db = { accounts: ['MEXC Futures'], entries: [], active: 'MEXC Futures' };
    let tempImgs = [];
    let myChart = null;

    function save() {
        localStorage.setItem('trade_track_pwa_v1', JSON.stringify(db));
        render();
    }

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
        if(id === 'dash') setTimeout(renderChart, 50);
    }

    async function processImages(e) {
        const files = Array.from(e.target.files);
        for (let f of files) {
            const reader = new FileReader();
            reader.readAsDataURL(f);
            reader.onload = (ev) => {
                const img = new Image();
                img.src = ev.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const max = 800;
                    const scale = max / img.width;
                    canvas.width = max;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    tempImgs.push(canvas.toDataURL('image/jpeg', 0.6));
                    document.getElementById('previews').innerHTML = tempImgs.map(i => `<img src="${i}">`).join('');
                };
            };
        }
    }

    document.getElementById('tradeForm').onsubmit = (e) => {
        e.preventDefault();
        const entry = {
            id: Date.now(),
            acc: document.getElementById('accSelect').value,
            date: new Date().toLocaleDateString(),
            pnl: parseFloat(document.getElementById('eBal').value) - parseFloat(document.getElementById('sBal').value),
            notes: document.getElementById('notes').value,
            imgs: [...tempImgs]
        };
        db.entries.unshift(entry);
        db.active = entry.acc;
        tempImgs = [];
        document.getElementById('tradeForm').reset();
        document.getElementById('previews').innerHTML = '';
        save();
        const msg = document.getElementById('msg');
        msg.innerHTML = '<div class="alert">Trade Saved!</div>';
        setTimeout(() => msg.innerHTML = '', 2000);
        showTab('dash');
    };

    function render() {
        document.getElementById('currentAcc').innerText = db.active;
        document.getElementById('accSelect').innerHTML = db.accounts.map(a => `<option ${a===db.active?'selected':''}>${a}</option>`).join('');
        
        const filtered = db.entries.filter(e => e.acc === db.active);
        const total = filtered.reduce((s, e) => s + e.pnl, 0);
        const wins = filtered.filter(e => e.pnl > 0).length;

        document.getElementById('totalPnl').innerText = `$${total.toLocaleString(undefined, {minimumFractionDigits:2})}`;
        document.getElementById('totalPnl').style.color = total >= 0 ? 'var(--success)' : 'var(--danger)';
        document.getElementById('winRate').innerText = `${filtered.length ? Math.round((wins/filtered.length)*100) : 0}%`;

        document.getElementById('history').innerHTML = filtered.map(e => `
            <div class="entry-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:12px; font-weight:700; opacity:0.6;">${e.date}</span>
                    <span style="font-weight:800; color:${e.pnl>=0?'var(--success)':'var(--danger)'}">${e.pnl>=0?'+':''}$${e.pnl.toFixed(2)}</span>
                </div>
                <p style="font-size:13px; margin:8px 0; line-height:1.4;">${e.notes}</p>
                <div class="img-grid">${e.imgs.map(i => `<img src="${i}">`).join('')}</div>
            </div>
        `).join('');
        
        renderChart();
    }

    function renderChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        const filtered = [...db.entries].filter(e => e.acc === db.active).reverse();
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: filtered.map(e => e.date),
                datasets: [{
                    data: filtered.map(e => e.pnl),
                    borderColor: '#60a5fa',
                    backgroundColor: 'rgba(96, 165, 250, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { grid: { color: 'rgba(255,255,255,0.05)' } } }
            }
        });
    }

    function createAcc() {
        const n = document.getElementById('newAccName').value;
        if(n) { db.accounts.push(n); db.active = n; document.getElementById('newAccName').value=''; save(); }
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `trades_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            db = JSON.parse(ev.target.result);
            save();
            location.reload();
        };
        reader.readAsText(e.target.files[0]);
    }

    window.onload = () => {
        const saved = localStorage.getItem('trade_track_pwa_v1');
        if(saved) db = JSON.parse(saved);
        render();
    };
</script>

</body>
</html>
