<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradeTrack Pro</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="FF-Logo.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #1e40af; --success: #10b981; --danger: #ef4444;
            --bg-primary: #ffffff; --bg-secondary: #f9fafb;
            --text-primary: #111827; --text-secondary: #6b7280; --border-color: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #60a5fa; --bg-primary: #111827; --bg-secondary: #1f2937;
                --text-primary: #f3f4f6; --text-secondary: #9ca3af; --border-color: #374151;
            }
        }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-secondary); color: var(--text-primary); }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }
        header { background: var(--bg-primary); padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; }
        .logo-group { display: flex; align-items: center; gap: 10px; }
        .app-logo { width: 32px; height: 32px; border-radius: 6px; }
        
        .tabs { display: flex; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 12px; margin: 15px 0; overflow: hidden; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: none; color: var(--text-secondary); cursor: pointer; font-weight: 600; font-size: 13px; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 16px; padding: 16px; margin-bottom: 15px; }
        .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .stat-card { background: var(--bg-primary); padding: 15px; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; }
        .stat-label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 18px; font-weight: 800; }

        input, select, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); font-size: 16px; margin-top: 5px; }
        label { font-size: 12px; font-weight: 700; color: var(--text-secondary); }
        
        .main-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .secondary-btn { background: #eee; color: #333; padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; cursor: pointer; }
        
        .acc-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); }
        .acc-item:last-child { border-bottom: none; }

        .img-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .img-grid img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; border: 1px solid var(--border-color); }
        
        .entry-card { background: var(--bg-primary); border: 1px solid var(--border-color); padding: 16px; border-radius: 16px; margin-bottom: 12px; border-left: 6px solid var(--primary); position: relative; }
        .delete-btn { position: absolute; top: 10px; right: 10px; font-size: 10px; padding: 4px 8px; background: rgba(239, 68, 68, 0.1); border: none; border-radius: 4px; color: var(--danger); cursor: pointer; }
        .entry-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; padding-right: 50px; }
        .entry-date { font-weight: 800; font-size: 14px; }
        .entry-pnl { font-weight: 800; font-size: 16px; }
        .entry-notes { font-size: 13px; line-height: 1.5; color: var(--text-primary); margin: 10px 0; white-space: pre-wrap; }
        
        .chart-container { height: 260px; width: 100%; }
    </style>
</head>
<body>

<header>
    <div class="logo-group">
        <img src="FF-Logo.png" alt="FF" class="app-logo" onerror="this.src='https://via.placeholder.com/32'">
        <h1 style="font-size: 18px; font-weight: 800;">TradeTrack</h1>
    </div>
    <select id="headerAccSelect" onchange="switchAccount(this.value)" style="width: auto; margin-top: 0; padding: 5px 10px; font-size: 11px; height: 30px;"></select>
</header>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('dash', this)">Equity</button>
        <button class="tab-btn" onclick="showTab('hist', this)">History</button>
        <button class="tab-btn" onclick="showTab('add', this)">+ Log</button>
        <button class="tab-btn" onclick="showTab('set', this)">Data</button>
    </div>

    <div id="dash" class="tab-content active">
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Balance</div>
                <div id="totalBalDisplay" class="stat-value">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Net Return</div>
                <div id="netReturnDisplay" class="stat-value">0.00%</div>
            </div>
        </div>
        <div class="card">
            <div class="chart-container"><canvas id="mainChart"></canvas></div>
        </div>
    </div>

    <div id="hist" class="tab-content">
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div id="winRateDisplay" class="stat-value">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Logs</div>
                <div id="logCountDisplay" class="stat-value">0</div>
            </div>
        </div>
        <div id="historyList"></div>
    </div>

    <div id="add" class="tab-content">
        <div class="card">
            <form id="tradeForm">
                <div style="margin-bottom: 12px;">
                    <label>Exchange / Account</label>
                    <select id="accSelect" onchange="autoPopulateStartBal()"></select>
                </div>
                <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                    <div style="flex:1;"><label>Start ($)</label><input type="number" id="sBal" step="0.01" required></div>
                    <div style="flex:1;"><label>End ($)</label><input type="number" id="eBal" step="0.01" required></div>
                </div>
                <div style="margin-bottom: 12px;">
                    <label>Notes</label>
                    <textarea id="notes" rows="3" placeholder="Strategy or session notes..."></textarea>
                </div>
                <div style="margin-bottom: 12px;">
                    <label>Discord Image Links (comma separated)</label>
                    <input type="text" id="imgLinks" placeholder="Paste Discord link here...">
                </div>
                <button type="submit" class="main-btn">Save Session</button>
            </form>
        </div>
    </div>

    <div id="set" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom:10px">Exchanges</h3>
            <div id="accManagerList"></div>
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <input type="text" id="newAccName" placeholder="Exchange Name" style="margin-top:0;">
                <button onclick="addAccount()" class="secondary-btn" style="background:var(--primary); color:white;">Add</button>
            </div>
        </div>

        <div class="card">
            <h3>Backup & Restore</h3>
            <button class="main-btn" onclick="exportData()" style="background:#eee; color:#333;">📥 Export .JSON</button>
            <div style="margin-top: 15px;">
                <label>Restore from Backup</label>
                <input type="file" id="importIn" onchange="importData(event)">
            </div>
            <button class="main-btn" onclick="clearData()" style="background:rgba(239, 68, 68, 0.1); color:var(--danger); margin-top:30px; font-size: 11px;">⚠️ Wipe App</button>
        </div>
    </div>
</div>

<script>
    let db = { accounts: ['MEXC Futures'], entries: [], active: 'MEXC Futures' };
    let myChart = null;

    function save() {
        localStorage.setItem('trade_track_v9', JSON.stringify(db));
        render();
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if(id === 'add') autoPopulateStartBal();
        if(id === 'dash') setTimeout(renderChart, 50);
        if(id === 'hist') renderHistory();
        if(id === 'set') renderAccountManager();
    }

    function switchAccount(val) {
        db.active = val;
        save();
        render();
        renderChart();
        if(document.getElementById('hist').classList.contains('active')) renderHistory();
    }

    function addAccount() {
        const name = document.getElementById('newAccName').value.trim();
        if(name && !db.accounts.includes(name)) {
            db.accounts.push(name);
            document.getElementById('newAccName').value = '';
            save();
            renderAccountManager();
        }
    }

    function deleteAccount(name) {
        if(db.accounts.length <= 1) return alert("You must have at least one account.");
        if(confirm(`Delete ${name} and all its trade history?`)) {
            db.accounts = db.accounts.filter(a => a !== name);
            db.entries = db.entries.filter(e => e.acc !== name);
            if(db.active === name) db.active = db.accounts[0];
            save();
            renderAccountManager();
        }
    }

    function renderAccountManager() {
        const list = document.getElementById('accManagerList');
        list.innerHTML = db.accounts.map(a => `
            <div class="acc-item">
                <span style="font-weight:700; font-size:14px;">${a}</span>
                <button onclick="deleteAccount('${a}')" style="color:var(--danger); background:none; border:none; font-size:11px; cursor:pointer;">Delete</button>
            </div>
        `).join('');
    }

    function autoPopulateStartBal() {
        const activeAcc = document.getElementById('accSelect').value;
        const filtered = db.entries.filter(e => e.acc === activeAcc);
        if (filtered.length > 0) {
            document.getElementById('sBal').value = filtered[0].end;
        }
    }

    document.getElementById('tradeForm').onsubmit = (e) => {
        e.preventDefault();
        const acc = document.getElementById('accSelect').value;
        const start = parseFloat(document.getElementById('sBal').value);
        const end = parseFloat(document.getElementById('eBal').value);
        const rawLinks = document.getElementById('imgLinks').value;
        const imgArray = rawLinks.split(',').map(l => l.trim()).filter(l => l.length > 5);

        db.entries.unshift({
            id: Date.now(), acc, date: new Date().toLocaleDateString(),
            start, end, pnl: end - start,
            notes: document.getElementById('notes').value, imgs: imgArray
        });
        document.getElementById('tradeForm').reset();
        save();
        showTab('dash', document.querySelector('.tab-btn'));
    };

    function deleteEntry(id) {
        if(confirm("Delete this log?")) {
            db.entries = db.entries.filter(e => e.id !== id);
            save();
            renderHistory();
        }
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        const filtered = db.entries.filter(e => e.acc === db.active);
        
        const totalLogs = filtered.length;
        const wins = filtered.filter(e => e.pnl > 0).length;
        const winRate = totalLogs > 0 ? Math.round((wins / totalLogs) * 100) : 0;
        
        document.getElementById('winRateDisplay').innerText = `${winRate}%`;
        document.getElementById('logCountDisplay').innerText = totalLogs;

        if (totalLogs === 0) {
            list.innerHTML = '<p style="text-align:center; padding:50px; opacity:0.5;">No logs for this exchange.</p>';
            return;
        }

        list.innerHTML = filtered.map(e => `
            <div class="entry-card">
                <button class="delete-btn" onclick="deleteEntry(${e.id})">Delete</button>
                <div class="entry-header">
                    <div class="entry-date">${e.date}</div>
                    <div class="entry-pnl" style="color:${e.pnl >= 0 ? 'var(--success)' : 'var(--danger)'}">
                        ${e.pnl >= 0 ? '+' : ''}$${e.pnl.toFixed(2)}
                    </div>
                </div>
                <div style="font-size:11px; opacity:0.6; font-weight:700;">Balance: $${e.end.toFixed(2)}</div>
                <div class="entry-notes">${e.notes}</div>
                <div class="img-grid">${e.imgs.map(l => `<img src="${l}" onclick="window.open('${l}')" onerror="this.style.display='none'">`).join('')}</div>
            </div>
        `).join('');
    }

    function render() {
        const accHtml = db.accounts.map(a => `<option value="${a}" ${a === db.active ? 'selected' : ''}>${a}</option>`).join('');
        document.getElementById('headerAccSelect').innerHTML = accHtml;
        document.getElementById('accSelect').innerHTML = accHtml;

        const filtered = db.entries.filter(e => e.acc === db.active);
        if(filtered.length > 0) {
            const currentBal = filtered[0].end;
            const initialBal = filtered[filtered.length - 1].start;
            const netReturn = ((currentBal - initialBal) / initialBal) * 100;
            document.getElementById('totalBalDisplay').innerText = `$${currentBal.toLocaleString(undefined, {minimumFractionDigits:2})}`;
            document.getElementById('netReturnDisplay').innerText = `${netReturn >= 0 ? '+' : ''}${netReturn.toFixed(2)}%`;
            document.getElementById('netReturnDisplay').style.color = netReturn >= 0 ? 'var(--success)' : 'var(--danger)';
        } else {
            document.getElementById('totalBalDisplay').innerText = '$0.00';
            document.getElementById('netReturnDisplay').innerText = '0.00%';
        }
    }

    function renderChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        const chartData = [...db.entries].filter(e => e.acc === db.active).reverse();
        if(myChart) myChart.destroy();
        if(chartData.length === 0) return;

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartData.map(e => e.date),
                datasets: [{ 
                    data: chartData.map(e => e.end),
                    borderColor: '#60a5fa', tension: 0.3, fill: true,
                    backgroundColor: 'rgba(96, 165, 250, 0.1)', pointRadius: 4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `TradeLog_Backup.json`;
        a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            db = JSON.parse(ev.target.result);
            save();
            location.reload();
        };
        reader.readAsText(e.target.files[0]);
    }

    function clearData() {
        if(confirm("Wipe all data?")) { localStorage.removeItem('trade_track_v9'); location.reload(); }
    }

    window.onload = () => {
        const saved = localStorage.getItem('trade_track_v9');
        if(saved) db = JSON.parse(saved);
        render();
        renderAccountManager();
    };
</script>
</body>
</html>
